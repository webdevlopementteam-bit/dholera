<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You — The Iconic Nest</title>
    <link rel="icon" type="image/png" href="./assets/logo.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Cinzel:wght@400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0c0a06;
        color: #c8b99a;
        font-family: "Crimson Text", Georgia, serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      .box {
        max-width: 560px;
      }
      .logo-wrap {
        width: 100px;
        height: 100px;
        margin: 0 auto 30px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid #c9a84c;
      }
      .logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .check {
        width: 70px;
        height: 70px;
        margin: 0 auto 24px;
        border-radius: 50%;
        border: 2px solid #c9a84c;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c9a84c;
        font-size: 32px;
      }
      h1 {
        font-family: "Cinzel", serif;
        font-size: clamp(28px, 5vw, 42px);
        color: #d9ae5f;
        letter-spacing: 2px;
        margin-bottom: 20px;
        text-transform: uppercase;
      }
      p {
        font-size: 18px;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 36px;
      }
      a.btn {
        display: inline-block;
        background: #c9a84c;
        color: #111;
        padding: 16px 40px;
        border-radius: 8px;
        text-decoration: none;
        font-family: "Cinzel", serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.5px;
        transition: 0.3s ease;
      }
      a.btn:hover {
        background: #e2c97e;
        transform: translateY(-3px);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo-wrap">
        <img src="./assets/logo.jpg" alt="The Iconic Nest" />
      </div>
      <div class="check">✓</div>
      <h1>Thank You</h1>
      <p>
        Your enquiry has been received successfully. Our advisory team will
        get in touch with you shortly to discuss your investment in
        <strong style="color: #d9ae5f">The Iconic Nest</strong>.
      </p>
      <a class="btn" href="./index.html">Back to Home</a>
    </div>
  </body>
</html>
